; STM32 Nucleo-C031C6 (Cortex-M0+, 32 KB flash / 12 KB RAM) — FreeRTOS — Wokwi for VS Code
[env:nucleo]
platform = ststm32
board = nucleo_c031c6
framework = arduino
lib_deps =
  stm32duino/STM32duino FreeRTOS
; Fallback if flash still overflows: enable link-time optimisation (LTO)
; by removing the ";" in front of the next line.
; extra_scripts = pre:lto.py
